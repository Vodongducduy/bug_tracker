{% extends 'base.html' %}
{% block title %}Tạo dự án mới — Bug Tracker{% endblock %}

{% block content %}
<ul class="breadcrumb">
  <li><a href="{% url 'dashboard' %}">Dự án</a></li>
  <li>/</li>
  <li>Tạo mới</li>
</ul>

<h1 style="margin-bottom:.3rem;">Tạo dự án mới</h1>
<p class="text-muted" style="margin-bottom:1.5rem;">Khởi tạo không gian làm việc cho đội ngũ của bạn.</p>

<div class="card" style="max-width:640px;">
  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label" for="name">Tên dự án *</label>
      <input type="text" id="name" name="name" required class="form-input"
             placeholder="VD: Website Bán Hàng, App Quản Lý...">
    </div>
    <div class="form-group">
      <label class="form-label" for="description">Mô tả</label>
      <textarea id="description" name="description" class="form-input" style="height:110px;"
                placeholder="Mục tiêu và phạm vi của dự án..."></textarea>
    </div>
    <div class="separator"></div>
    <div style="display:flex;gap:.65rem;justify-content:flex-end;">
      <a href="{% url 'dashboard' %}" class="btn btn-ghost">Huỷ</a>
      <button type="submit" class="btn btn-primary">Tạo dự án</button>
    </div>
  </form>
</div>
{% endblock %}
