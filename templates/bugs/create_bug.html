{% extends 'base.html' %}
{% block title %}Báo lỗi mới — {{ project.name }}{% endblock %}

{% block content %}
<ul class="breadcrumb">
  <li><a href="{% url 'dashboard' %}">Dự án</a></li>
  <li>/</li>
  <li><a href="{% url 'project_detail' project.id %}">{{ project.name }}</a></li>
  <li>/</li>
  <li>Báo lỗi mới</li>
</ul>

<h1 style="margin-bottom:1.5rem;">Báo cáo lỗi mới</h1>

<div class="card" style="max-width:820px;">
  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Tiêu đề lỗi *</label>
      <input type="text" name="title" class="form-input" placeholder="VD: Lỗi đăng nhập trên mobile" required>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Loại lỗi</label>
        <select name="type" class="form-input">
          <option value="Functional">Functional Bug</option>
          <option value="System">System Bug</option>
          <option value="UI">UI Bug</option>
          <option value="Performance">Performance Bug</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Độ ưu tiên</label>
        <select name="priority" class="form-input">
          <option value="S">🔴 Critical (S)</option>
          <option value="A">🟡 High (A)</option>
          <option value="B">⚪ Medium (B)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Mô tả chi tiết & Bước tái hiện *</label>
      <textarea name="description" class="form-input" style="height:180px;" placeholder="1. Mở ứng dụng...&#10;2. Thực hiện hành động X...&#10;3. Kết quả thực tế: ...&#10;4. Kết quả mong đợi: ..." required></textarea>
    </div>

    <div class="separator"></div>
    <div style="display:flex;gap:.65rem;justify-content:flex-end;">
      <a href="{% url 'project_detail' project.id %}" class="btn btn-ghost">Huỷ bỏ</a>
      <button type="submit" class="btn btn-primary">Gửi báo cáo</button>
    </div>
  </form>
</div>
{% endblock %}
