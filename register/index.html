
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Bug Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/bug_tracker/static/css/styles.css">
  
</head>
<body>




<div class="auth-wrap">
  <div class="auth-card" style="max-width:460px;">
    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a6b1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2l1.88 1.88"/><path d="M14.12 3.88L16 2"/>
          <path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/>
          <path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6z"/>
          <path d="M12 20v-9"/>
          <path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/>
          <path d="M3 21c0-2.1 1.7-3.9 3.8-4"/>
          <path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/>
          <path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/>
        </svg>
      </div>
      <div class="auth-logo-name">bugiz</div>
    </div>

    <form method="POST" novalidate>
      <input type="hidden" name="csrfmiddlewaretoken" value="Bc4KXq7Gur6TsFYP3KYSM4w9D05nCHIOPA6Qlc5ZkibO4NOgmZl4xoGL31a524eQ">
      

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">First name</label>
          <input type="text" name="first_name" class="form-input" placeholder="Tên (Không bắt buộc)" id="id_first_name">
          
        </div>
        <div class="form-group">
          <label class="form-label">Last name</label>
          <input type="text" name="last_name" class="form-input" placeholder="Họ (Không bắt buộc)" id="id_last_name">
          
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="Tên đăng nhập" required id="id_username">
        
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-input" placeholder="Email" maxlength="320" required id="id_email">
        
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="Mật khẩu" required id="id_password">
        
      </div>
      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input type="password" name="password_confirm" class="form-input" placeholder="Nhập lại Mật khẩu" required id="id_password_confirm">
        
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:.4rem;">Create account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/bug_tracker/login/">Sign in</a>
    </div>
  </div>
</div>




</body>
</html>
