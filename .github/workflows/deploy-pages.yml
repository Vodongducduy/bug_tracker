name: Deploy Mockup to GitHub Pages

on:
  push:
    branches: [mssql]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'apps/bugs/static_export.py'
      - 'apps/bugs/management/commands/export_static_site.py'
      - 'core/settings.py'
      - 'static/**'
      - 'templates/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django==6.0.4 python-dotenv==1.2.2 whitenoise==6.12.0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site
        env:
          STATIC_EXPORT: '1'
        run: |
          python manage.py export_static_site --output-dir _site --site-prefix /bug_tracker

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
